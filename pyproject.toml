[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dominant-layer-zo"
version = "0.1.0"
description = "Activation-based layer selection and single-layer zeroth-order fine-tuning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.4.0", "transformers==4.51.1", "datasets==3.4.1",
  "accelerate==0.33.0", "numpy==1.26.4", "PyYAML==6.0.2",
  "sentencepiece==0.2.1", "safetensors==0.4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2"]
plot = ["matplotlib>=3.9,<4"]

[project.scripts]
dlzo = "dominant_layer_zo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
