# Initial settings; tune LR on held-out train before performance reporting.
# Native eager fp16; optional model.fp32_attention_scores. No checkpoints.
model:
  family: mistral
  name: mistralai/Mistral-7B-v0.1
  dtype: float16
  revision: 27d67f1b5f57dc0953326b2601d68371d40ea8da
  fp32_attention_scores: false
data:
  task: copa
  seed: 0
  cutoff_len: 256
  train_on_inputs: false
  loader_kwargs: {}
training:
  method: zo
  scope: full
  layer: null
  part: layer
  lr: 5.0e-07
  epsilon: 0.001
  directions: 1
  noise: rademacher
  seed: 0
  steps: 10000
  batch_size: 16
  eval_steps: 200
  logging_steps: 10
  max_zo_coeff: null
  non_diff: false
  forward_autocast: none
  upcast_loss_logits_fp32: true
  upcast_zo_scalar_fp32: true
evaluation:
  dtype: float16
  seed: 0
  max_length: 2048
  batch_size: 4
  max_samples: null
  max_new_tokens: 32
  after_training: true
checkpoint:
  strategy: 'no'
  save_steps: 2000
  save_total_limit: 2
  load_best_model_at_end: false
  save_final: false
output_dir: runs/mistral-copa-full-seed0
